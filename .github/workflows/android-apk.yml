name: Build Android APK

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Download project
uses: actions/checkout@v4

  - name: Install Godot
    uses: chickensoft-games/setup-godot@v2
    with:
      version: 4.3.0
      use-dotnet: false

  - name: Install Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Install Android SDK
    uses: android-actions/setup-android@v3
    with:
      packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

  - name: Accept Android licenses
    run: yes | sdkmanager --licenses || true

  - name: Install export templates
    run: |
      mkdir -p ~/.local/share/godot/export_templates/4.3.stable
      wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O /tmp/templates.tpz
      unzip -q /tmp/templates.tpz -d /tmp/godot_templates
      cp -r /tmp/godot_templates/templates/* ~/.local/share/godot/export_templates/4.3.stable/

  - name: Configure Android signing
    run: |
      mkdir -p ~/.android
      keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

  - name: Configure Godot
    run: |
      mkdir -p ~/.config/godot
      cat > ~/.config/godot/editor_settings-4.tres <<EOF
      [gd_resource type="EditorSettings" format=3]

      [resource]
      export/android/android_sdk_path = "$ANDROID_HOME"
      export/android/java_sdk_path = "$JAVA_HOME"
      EOF

      cat > export_presets.cfg <<'EOF'
      [preset.0]
      name="Android"
      platform="Android"
      runnable=true
      dedicated_server=false
      custom_features=""
      export_filter="all_resources"
      include_filter=""
      exclude_filter=""
      export_path="build/NeonLluvia.apk"
      encryption_include_filters=""
      encryption_exclude_filters=""
      encrypt_pck=false
      encrypt_directory=false

      [preset.0.options]
      custom_template/debug=""
      custom_template/release=""
      gradle_build/use_gradle_build=false
      architectures/armeabi-v7a=true
      architectures/arm64-v8a=true
      package/unique_name="com.neonlluvia.game"
      package/name="Neon Lluvia"
      package/signed=true
      keystore/debug="/home/runner/.android/debug.keystore"
      keystore/debug_user="androiddebugkey"
      keystore/debug_password="android"
      screen/immersive_mode=true
      screen/orientation=1
      permissions/internet=true
      EOF

  - name: Import project
    run: godot --headless --editor --path . --quit

  - name: Export Android APK
    env:
      GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
    run: |
      mkdir -p build
      godot --headless --path . --verbose --export-debug "Android" build/NeonLluvia.apk
      test -s build/NeonLluvia.apk

  - name: Upload APK
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: NeonLluvia-Android-APK
      path: build/NeonLluvia.apk
